# 正式发布：由 tag 触发，构建产物并创建 GitHub Release
#
# 发布单元与 tag 一一对应，tag 形式为 `<单元>@<版本>`：
#   vue-next@1.1.0 / vue-next-pro@1.1.0 / vue-next-pro-ai@1.1.0 / styles@1.1.0
#
# 版本号事实来源是该包自己的 package.json；tag 只负责「宣布发布」，
# 因此 tag 版本与 package.json 不一致时，打包步骤会直接失败（见 scripts/release/pack.js）。
#
# 发布物是四个自包含产物目录打成的 .tgz，作为 Release 附件随 tag 分发；
# 根 dist/ 被 .gitignore 忽略，不入库，也不作为发布媒介。
name: Release

on:
  push:
    tags:
      - 'vue-next@*'
      - 'vue-next-pro@*'
      - 'vue-next-pro-ai@*'
      - 'styles@*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要重新发布的 tag（如 vue-next-pro@1.1.0）
        required: true

# 创建 Release 需要写权限；其余步骤只读
permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          # 手动触发时按输入 checkout 对应 tag，保证产物与标签一致
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 解析 tag，得到发布单元与版本号；两者后续被 pack 与 Release 标题复用
      - name: 解析标签
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          UNIT="${TAG%@*}"
          VERSION="${TAG#*@}"

          case "$UNIT" in
            vue-next|vue-next-pro|vue-next-pro-ai|styles) ;;
            *)
              echo "✖ 无法识别的发布单元：$UNIT（tag 应为 <单元>@<版本>）" >&2
              exit 1
              ;;
          esac

          {
            echo "TAG=$TAG"
            echo "UNIT=$UNIT"
            echo "VERSION=$VERSION"
            # 附件名与源码包目录名一致：bst-vue-next / bst-vue-next-pro / bst-vue-next-pro-ai / bst-styles
            echo "FILE=bst-$UNIT"
          } >> "$GITHUB_ENV"

      # 与 ci.yml 相同的构建链：产物必须由当前提交现构建，不能复用任何缓存产物
      - name: 组件源码包构建
        run: pnpm build:private

      - name: 样式包构建
        run: pnpm build:style

      - name: 基础组件主包聚合
        run: pnpm build:vue:next

      - name: 高级组件主包聚合
        run: pnpm build:vue:next:pro

      - name: AI 组件主包聚合
        run: pnpm build:vue:next:pro:ai

      - name: 归拢产物到根 dist
        run: pnpm move:main:dist

      # 从该包的 CHANGELOG 抽取当前版本段落，作为 Release 正文
      - name: 生成发布说明
        run: node scripts/release/notes.js --package "$UNIT" --version "$VERSION" --out release-notes.md

      # --expect-version 保证 tag、package.json、CHANGELOG 三者版本一致
      - name: 打包发布物
        run: node scripts/release/pack.js --only "$UNIT" --expect-version "$VERSION"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if printf '%s' "$VERSION" | grep -q -- '-'; then
            gh release create "$TAG" "release/$FILE-$VERSION.tgz" \
              --verify-tag --prerelease \
              --title "$UNIT v$VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG" "release/$FILE-$VERSION.tgz" \
              --verify-tag \
              --title "$UNIT v$VERSION" --notes-file release-notes.md
          fi

      - name: 输出发布结果
        run: echo "已发布 $TAG -> https://github.com/${{ github.repository }}/releases/tag/$TAG"
