packages:
  - packages/**

allowBuilds:
  esbuild: true

#   build   —— 构建编译依赖组
#   lint    —— 代码规范依赖组
#   runtime —— 运行进行依赖组
#   test    —— 单元测试依赖组
#   types   —— 类型声明依赖组
#   docs    —— 文档站点与组件预览依赖组
catalogs:
  build:
    '@babel/core': ^7.29.7
    '@babel/helper-module-imports': ^7.29.7
    '@babel/plugin-transform-modules-commonjs': ^7.29.7
    '@babel/plugin-transform-object-assign': ^7.29.7
    '@babel/plugin-transform-runtime': ^7.29.7
    '@babel/preset-env': ^7.29.7
    '@rollup/plugin-babel': ^7.1.0
    '@rollup/plugin-commonjs': ^29.0.3
    '@rollup/plugin-json': ^6.1.0
    '@rollup/plugin-node-resolve': ^16.0.3
    '@rollup/plugin-replace': ^6.0.3
    '@rollup/plugin-typescript': ^12.3.0
    '@rollup/plugin-url': ^8.0.2
    '@vitejs/plugin-vue': ^6.0.10
    '@vitejs/plugin-vue-jsx': ^5.1.6
    '@vue/babel-plugin-jsx': ^2.0.1
    autoprefixer: ^10.6.1
    cross-env: ^10.1.0
    esbuild: ^0.28.2
    execa: ^9.6.1
    fs-extra: ^11.4.1
    glob: ^13.0.6
    less: ^4.9.1
    postcss: ^8.5.30
    rimraf: ^6.1.3
    rollup: ^4.64.6
    rollup-plugin-esbuild: ^6.2.1
    rollup-plugin-postcss: ^4.0.2
    tsx: ^4.23.15
    vite: ^7.3.7

  lint:
    '@eslint/js': ^10.0.1
    '@typescript-eslint/eslint-plugin': ^8.71.2
    '@typescript-eslint/parser': ^8.71.2
    '@vue/tsconfig': ^0.9.1
    eslint: ^10.12.0
    eslint-config-prettier: ^10.1.8
    eslint-plugin-vue: ^10.11.1
    postcss-less: ^6.0.0
    prettier: ^3.9.10
    stylelint: ^17.16.0
    stylelint-config-standard: ^40.0.0
    vue-eslint-parser: ^10.4.1

  runtime:
    '@babel/runtime': ^7.29.7
    '@popperjs/core': ^2.11.8
    clipboard: ^2.0.11
    dayjs: ^1.11.23
    lodash-es: ^4.18.1
    mitt: ^3.0.1
    raf: ^3.4.1
    sortablejs: ^1.15.7
    tinycolor2: ^1.6.0
    validator: ^13.15.35
    vue: ^3.5.44
    vue-router: ^4.6.4

  test:
    '@vitest/coverage-v8': ^3.2.7
    '@vitest/ui': ^3.2.7
    '@vue/server-renderer': ^3.5.44
    '@vue/test-utils': ^2.5.1
    jsdom: ^29.1.1
    mockdate: ^3.0.5
    vitest: ^3.2.7

  types:
    '@types/lodash-es': ^4.17.12
    '@types/node': ^20.19.43
    '@types/raf': ^3.4.3
    '@types/sortablejs': ^1.15.9
    '@types/tinycolor2': ^1.4.6
    '@types/validator': ^13.15.10
    typescript: ^6.0.3
    vue-tsc: ^3.3.13

  docs:
    '@storybook/addon-a11y': ^10.6.2
    '@storybook/addon-docs': ^10.6.2
    '@storybook/vue3-vite': ^10.6.2
    storybook: ^10.6.2
    vitepress: ^1.6.4

# 提升依赖项到根目录，以避免重复安装相同的包
shamefullyHoist: true
